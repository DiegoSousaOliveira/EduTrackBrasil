# Publica a pasta site/ no GitHub Pages.
# Roda a cada push na main e também manualmente (aba Actions → "Publicar site" → Run workflow).
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo necessário: ler o repositório e publicar no Pages (id-token prova ao Pages que o deploy vem deste workflow)
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo não cancela o deploy que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
